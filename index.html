<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dj交易所 - 快速支付</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-96">
        <h2 class="text-2xl font-bold text-center mb-6 text-blue-600">dj交易所 收银台</h2>
        
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">支付金额 (元)</label>
            <input type="number" id="amount" placeholder="0.00" 
                class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-xl">
        </div>

        <button onclick="handlePay()" id="payBtn"
            class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg transition duration-200">
            立即使用微信支付
        </button>

        <p class="text-xs text-gray-400 mt-4 text-center">支付由微信支付提供安全技术支持</p>
    </div>

    <script>
        async function handlePay() {
            const amount = document.getElementById('amount').value;
            if (!amount || amount <= 0) {
                alert('请输入有效金额');
                return;
            }

            const btn = document.getElementById('payBtn');
            btn.innerText = '正在跳转...';
            btn.disabled = true;

            try {
                // 这里调用你的后端接口
                const response = await fetch('/api/create-pay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: amount })
                });
                const data = await response.json();

                if (data.payUrl) {
                    // 跳转到微信支付中间页
                    window.location.href = data.payUrl;
                } else {
                    alert('支付接口调用失败：' + data.message);
                }
            } catch (err) {
                alert('系统错误，请检查网络');
            } finally {
                btn.innerText = '立即使用微信支付';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
